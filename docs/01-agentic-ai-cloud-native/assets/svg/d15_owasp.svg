<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560"><rect x="0" y="0" width="1080" height="560" fill="#FFFFFF"/><text x="40" y="40" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">OWASP Top 10 for Agentic Applications, mapped to controls you already run</text><text x="40" y="62" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">Released 9 December 2025. Ten entries, ASI01–ASI10. Most mitigations are cloud-native primitives you already operate.</text><rect x="40" y="92" width="1000" height="44" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.4"/><rect x="40" y="92" width="76" height="44" rx="8" fill="#E11D48"/><rect x="100" y="92" width="16" height="44" rx="0" fill="#E11D48"/><text x="78" y="120" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">ASI01</text><text x="132" y="120" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9F1239" font-weight="bold">Agent Goal Hijack</text><text x="458" y="120" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Separate trusted/untrusted context; never let tool output rewrite the objective</text><rect x="40" y="142" width="1000" height="44" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.4"/><rect x="40" y="142" width="76" height="44" rx="8" fill="#E11D48"/><rect x="100" y="142" width="16" height="44" rx="0" fill="#E11D48"/><text x="78" y="170" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">ASI02</text><text x="132" y="170" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9F1239" font-weight="bold">Tool Misuse &amp; Exploitation</text><text x="458" y="170" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Least-privilege RBAC per tool; read/write split; approval gates</text><rect x="40" y="192" width="1000" height="44" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.4"/><rect x="40" y="192" width="76" height="44" rx="8" fill="#EA580C"/><rect x="100" y="192" width="16" height="44" rx="0" fill="#EA580C"/><text x="78" y="220" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">ASI03</text><text x="132" y="220" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9A3412" font-weight="bold">Identity &amp; Privilege Abuse</text><text x="458" y="220" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Per-user OBO identity, not shared service accounts; short-lived scoped tokens</text><rect x="40" y="242" width="1000" height="44" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.4"/><rect x="40" y="242" width="76" height="44" rx="8" fill="#EA580C"/><rect x="100" y="242" width="16" height="44" rx="0" fill="#EA580C"/><text x="78" y="270" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">ASI04</text><text x="132" y="270" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9A3412" font-weight="bold">Agentic Supply Chain</text><text x="458" y="270" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Allowlist MCP servers; signed manifests; pin versions; internal registry</text><rect x="40" y="292" width="1000" height="44" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/><rect x="40" y="292" width="76" height="44" rx="8" fill="#D97706"/><rect x="100" y="292" width="16" height="44" rx="0" fill="#D97706"/><text x="78" y="320" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">ASI05</text><text x="132" y="320" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#92400E" font-weight="bold">Unexpected Code Execution</text><text x="458" y="320" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Separate generation from execution; ephemeral microVM or Wasm sandbox</text><rect x="40" y="342" width="1000" height="44" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/><rect x="40" y="342" width="76" height="44" rx="8" fill="#D97706"/><rect x="100" y="342" width="16" height="44" rx="0" fill="#D97706"/><text x="78" y="370" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">ASI06</text><text x="132" y="370" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#92400E" font-weight="bold">Memory &amp; Context Poisoning</text><text x="458" y="370" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Segment memory per tenant; expire unverified data; track provenance</text><rect x="40" y="392" width="1000" height="44" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.4"/><rect x="40" y="392" width="76" height="44" rx="8" fill="#0D9488"/><rect x="100" y="392" width="16" height="44" rx="0" fill="#0D9488"/><text x="78" y="420" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">ASI07</text><text x="132" y="420" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#115E59" font-weight="bold">Insecure Inter-Agent Comms</text><text x="458" y="420" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">mTLS via SPIFFE/SVID; zero-trust between agents; verify signed A2A cards</text><rect x="40" y="442" width="1000" height="44" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.4"/><rect x="40" y="442" width="76" height="44" rx="8" fill="#0D9488"/><rect x="100" y="442" width="16" height="44" rx="0" fill="#0D9488"/><text x="78" y="470" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">ASI08</text><text x="132" y="470" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#115E59" font-weight="bold">Cascading Failures</text><text x="458" y="470" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Rate limits, circuit breakers, blast-radius caps — you already know this one</text><rect x="40" y="492" width="1000" height="44" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.4"/><rect x="40" y="492" width="76" height="44" rx="8" fill="#0284C7"/><rect x="100" y="492" width="16" height="44" rx="0" fill="#0284C7"/><text x="78" y="520" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">ASI10</text><text x="132" y="520" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#075985" font-weight="bold">Rogue Agents</text><text x="458" y="520" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Inventory (AIBOM), kill switch, behavioural monitoring</text><rect x="40" y="548" width="1000" height="58" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="62" y="572" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#1E293B" font-weight="bold">Alongside it: the OWASP MCP Top 10 (MCP01–MCP10, beta; next release cycle October 2026)</text><text x="62" y="592" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Narrower and protocol-specific — it targets tool discovery, context passing and tool invocation. MCP01 is Token Mismanagement &amp; Secret Exposure.</text></svg>