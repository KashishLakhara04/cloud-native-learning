<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="545" viewBox="0 0 1080 545"><defs><marker id="ah4338CA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4338CA"/></marker></defs><rect x="0" y="0" width="1080" height="545" fill="#FFFFFF"/><text x="40" y="40" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">MCP architecture: host, client, server</text><text x="40" y="62" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">A server is usually a thin wrapper over an API you already run. The interesting engineering is in the tool design, not the plumbing.</text><rect x="40" y="88" width="340" height="200" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.8"/><text x="60" y="116" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#075985" font-weight="bold">HOST</text><text x="60" y="136" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">the AI application the human uses</text><rect x="60" y="150" width="300" height="40" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="210.0" y="166.205" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#334155" font-weight="bold" text-anchor="middle">Cursor · Claude Code · VS Code · kagent</text><text x="210.0" y="180.925" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#334155" font-weight="bold" text-anchor="middle">pod</text><text x="60" y="216" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#075985" font-weight="bold">CLIENT</text><text x="60" y="234" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#64748B" font-style="italic">one connection manager per server</text><rect x="60" y="244" width="88" height="30" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.3"/><text x="104" y="264" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#075985" text-anchor="middle">client 1</text><rect x="160" y="244" width="88" height="30" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.3"/><text x="204" y="264" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#075985" text-anchor="middle">client 2</text><rect x="260" y="244" width="88" height="30" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.3"/><text x="304" y="264" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#075985" text-anchor="middle">client 3</text><rect x="600" y="88" width="440" height="200" rx="12" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.8"/><text x="620" y="116" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#312E81" font-weight="bold">MCP SERVER</text><text x="620" y="136" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">a thin adapter over an existing API</text><rect x="620" y="150" width="400" height="40" rx="7" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.3"/><text x="634" y="167" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#312E81" font-weight="bold">TOOLS</text><text x="634" y="182" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">model-controlled actions — get_pods, query_prometheus. The 90% case.</text><rect x="620" y="195" width="400" height="40" rx="7" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.3"/><text x="634" y="212" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#312E81" font-weight="bold">RESOURCES</text><text x="634" y="227" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">app-controlled data the host attaches — a file, a dashboard.</text><rect x="620" y="240" width="400" height="40" rx="7" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.3"/><text x="634" y="257" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#312E81" font-weight="bold">PROMPTS</text><text x="634" y="272" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">user-controlled templates, usually surfaced as slash commands.</text><line x1="384" y1="188" x2="596" y2="188" stroke="#4338CA" stroke-width="2.0" marker-end="url(#ah4338CA)"/><text x="490" y="178" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="10.5" fill="#312E81" font-weight="bold" text-anchor="middle">JSON-RPC</text><rect x="40" y="320" width="620" height="200" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="60" y="346" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#1E293B" font-weight="bold">TWO TRANSPORTS — and the whole governance story lives here</text><rect x="60" y="362" width="280" height="140" rx="10" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="76" y="386" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#9F1239" font-weight="bold">stdio</text><rect x="140" y="372" width="97.75" height="20" rx="10.0" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.3"/><text x="188.875" y="385.6" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#9F1239" font-weight="bold" text-anchor="middle">ungovernable</text><text x="76" y="410" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Server is a subprocess on the same</text><text x="76" y="427" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">machine. Zero network. Holds the</text><text x="76" y="444" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">laptop's own credentials.</text><text x="76" y="461" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Audit says "the server called delete",</text><text x="76" y="478" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">never who.</text><rect x="360" y="362" width="280" height="140" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/><text x="376" y="386" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#166534" font-weight="bold">Streamable HTTP</text><text x="376" y="410" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">A remote HTTP service — what you</text><text x="376" y="427" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">deploy in Kubernetes. Stateless since</text><text x="376" y="444" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">the 2026-07-28 spec, so it sits behind</text><text x="376" y="461" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">a plain round-robin LB.</text><text x="376" y="478" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">The old HTTP+SSE transport is deprecated.</text><rect x="680" y="320" width="360" height="200" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="700" y="346" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#92400E" font-weight="bold">TOOL DESIGN RULES</text><text x="700" y="368" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#D97706" font-weight="bold">▸</text><text x="714" y="368" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Tool descriptions ARE prompts — the model picks from</text><text x="714" y="382" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">prose.</text><text x="700" y="398" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#D97706" font-weight="bold">▸</text><text x="714" y="398" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Return small, semantic results. Not 4,000 lines of YAML.</text><text x="700" y="414" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#D97706" font-weight="bold">▸</text><text x="714" y="414" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Few sharp tools beat many vague ones.</text><text x="700" y="430" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#D97706" font-weight="bold">▸</text><text x="714" y="430" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Separate read from write. Always. Different</text><text x="714" y="444" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">ServiceAccounts.</text><text x="700" y="460" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#D97706" font-weight="bold">▸</text><text x="714" y="460" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Destructive tools require elicitation (human confirm).</text></svg>