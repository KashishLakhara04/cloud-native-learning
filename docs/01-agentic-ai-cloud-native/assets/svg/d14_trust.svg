<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520"><rect x="0" y="0" width="1080" height="520" fill="#FFFFFF"/><text x="40" y="40" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">The core threat model: the model cannot tell these apart</text><text x="40" y="62" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">An agent holds credentials, takes instructions from text, and cannot reliably distinguish its operator's instructions from text it happened to read. Not fixable with better prompting.</text><rect x="40" y="96" width="470" height="228" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/><text x="62" y="124" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13.5" fill="#166534" font-weight="bold">TRUSTED</text><text x="62" y="144" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#64748B" font-style="italic">you wrote it and reviewed it</text><rect x="62" y="158" width="426" height="30" rx="7" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.2"/><text x="78" y="178" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#475569">system prompt / agent spec</text><rect x="62" y="196" width="426" height="30" rx="7" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.2"/><text x="78" y="216" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#475569">your SKILL.md  (if reviewed)</text><rect x="62" y="234" width="426" height="30" rx="7" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.2"/><text x="78" y="254" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#475569">your runbooks  (if reviewed)</text><rect x="570" y="96" width="470" height="228" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.8"/><text x="592" y="124" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13.5" fill="#9F1239" font-weight="bold">UNTRUSTED</text><text x="592" y="144" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#64748B" font-style="italic">all of it — assume every byte is hostile</text><rect x="592" y="158" width="426" height="26" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.1"/><text x="606" y="176" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">pod logs</text><rect x="592" y="189" width="426" height="26" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.1"/><text x="606" y="207" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Jira ticket bodies</text><rect x="592" y="220" width="426" height="26" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.1"/><text x="606" y="238" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">GitHub issue text</text><rect x="592" y="251" width="426" height="26" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.1"/><text x="606" y="269" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">HTTP response bodies</text><rect x="592" y="282" width="426" height="26" rx="6" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.6"/><text x="606" y="300" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#9F1239" font-weight="bold">★  MCP TOOL DESCRIPTIONS from third-party servers</text><text x="540" y="220" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#64748B" font-weight="bold" text-anchor="middle">≠</text><rect x="200" y="334" width="680" height="34" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4" stroke-dasharray="5 4"/><text x="540" y="356" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#1E293B" font-weight="bold" text-anchor="middle">The model sees ONE text stream. It cannot see this boundary.</text><rect x="40" y="386" width="1000" height="112" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/><text x="62" y="414" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#92400E" font-weight="bold">THE LETHAL TRIFECTA — the most useful heuristic in agent design</text><rect x="62" y="432" width="199.94140625" height="38" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/><rect x="74" y="442" width="20" height="20" rx="10" fill="#0284C7"/><text x="84" y="457" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text><text x="102" y="456" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#075985" font-weight="bold">access to private data</text><text x="273.94140625" y="457" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#64748B" font-weight="bold">+</text><rect x="291.94140625" y="432" width="255.25390625" height="38" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><rect x="303.94140625" y="442" width="20" height="20" rx="10" fill="#D97706"/><text x="313.94140625" y="457" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text><text x="331.94140625" y="456" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#92400E" font-weight="bold">exposure to untrusted content</text><text x="559.1953125" y="457" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#64748B" font-weight="bold">+</text><rect x="577.1953125" y="432" width="274.61328125" height="38" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><rect x="589.1953125" y="442" width="20" height="20" rx="10" fill="#E11D48"/><text x="599.1953125" y="457" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text><text x="617.1953125" y="456" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9F1239" font-weight="bold">ability to communicate externally</text><text x="62" y="486" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#475569" font-style="italic">Break any ONE leg and the exfiltration path closes. Check every agent you deploy against this.</text></svg>