<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420"><defs><marker id="ah16A34A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/></marker><marker id="ahE11D48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E11D48"/></marker></defs><rect x="0" y="0" width="1080" height="420" fill="#FFFFFF"/><text x="40" y="40" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">The RBAC trap: there are two identities, not one</text><text x="40" y="62" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">The agent's blast radius is the SERVER's ServiceAccount — not the human's permissions. This is the single most common mistake.</text><rect x="60" y="110" width="150" height="62" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="135.0" y="135.88" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#334155" font-weight="bold" text-anchor="middle">Cursor</text><text x="135.0" y="154.51999999999998" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569" text-anchor="middle">the human</text><rect x="340" y="110" width="200" height="62" rx="8" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.6"/><text x="440.0" y="135.88" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#312E81" font-weight="bold" text-anchor="middle">MCP server</text><text x="440.0" y="154.51999999999998" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569" text-anchor="middle">a pod in your cluster</text><rect x="690" y="110" width="180" height="62" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.6"/><text x="780.0" y="144.875" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="12.5" fill="#075985" font-weight="bold" text-anchor="middle">kube-apiserver</text><line x1="212" y1="141" x2="338" y2="141" stroke="#16A34A" stroke-width="2.0" marker-end="url(#ah16A34A)"/><text x="275" y="130" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="10.5" fill="#166534" font-weight="bold" text-anchor="middle">OIDC token</text><text x="275" y="160" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#64748B" font-style="italic" text-anchor="middle">“who am I”</text><line x1="542" y1="141" x2="688" y2="141" stroke="#E11D48" stroke-width="2.0" marker-end="url(#ahE11D48)"/><text x="615" y="130" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="10.5" fill="#9F1239" font-weight="bold" text-anchor="middle">ServiceAccount</text><text x="615" y="160" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#64748B" font-style="italic" text-anchor="middle">“what it can do”</text><text x="440" y="218" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#E11D48" font-weight="bold" text-anchor="middle">▲</text><rect x="180" y="228" width="720" height="44" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="540" y="255" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#9F1239" font-weight="bold" text-anchor="middle">Two DIFFERENT identities. Without impersonation, the second one is all the apiserver ever sees.</text><rect x="40" y="300" width="1000" height="100" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/><text x="60" y="326" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#166534" font-weight="bold">THE FIX — in order of effort</text><text x="60" y="352" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#166534" font-weight="bold">Baseline</text><text x="125.04296875" y="352" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">— bind to the built-in view / cluster-reader role</text><text x="560" y="352" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#166534" font-weight="bold">Scope</text><text x="609.03125" y="352" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">— namespace Roles, not cluster-admin; per-team servers</text><text x="60" y="376" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#166534" font-weight="bold">Split</text><text x="99.890625" y="376" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">— read and write are separate servers, separate SAs</text><text x="560" y="376" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#166534" font-weight="bold">Best</text><text x="598.90625" y="376" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">— gateway propagates user identity → apiserver impersonation</text></svg>