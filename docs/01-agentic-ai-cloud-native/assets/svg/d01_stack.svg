<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700"><rect x="0" y="0" width="1080" height="700" fill="#FFFFFF"/><text x="40" y="42" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">The six-layer agentic stack</text><text x="40" y="64" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">Every project in this space lives on exactly one layer. Most confusion comes from comparing things on different layers.</text><rect x="40" y="96" width="860" height="78" rx="10" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.8"/><rect x="40" y="96" width="58" height="78" rx="10" fill="#0284C7"/><rect x="80" y="96" width="18" height="78" rx="0" fill="#0284C7"/><text x="69" y="141.0" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">L5</text><text x="114" y="124" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#075985" font-weight="bold">SURFACE</text><text x="203.921875" y="124" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#64748B" font-style="italic">Where the human meets it</text><text x="114" y="150" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#475569">Slack  ·  IDE (Cursor / Claude Code)  ·  CLI  ·  Web  ·  Pager</text><rect x="40" y="182" width="860" height="78" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/><rect x="40" y="182" width="58" height="78" rx="10" fill="#D97706"/><rect x="80" y="182" width="18" height="78" rx="0" fill="#D97706"/><text x="69" y="227.0" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">L4</text><text x="114" y="210" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#92400E" font-weight="bold">AGENT RUNTIME</text><text x="267.4453125" y="210" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#64748B" font-style="italic">The loop, memory, budgets, sub-agents</text><text x="114" y="236" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#475569">kagent  ·  HolmesGPT  ·  K8sGPT  ·  Claude Code  ·  LangGraph</text><rect x="40" y="268" width="860" height="78" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.8"/><rect x="40" y="268" width="58" height="78" rx="10" fill="#0D9488"/><rect x="80" y="268" width="18" height="78" rx="0" fill="#0D9488"/><text x="69" y="313.0" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">L3</text><text x="114" y="296" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#115E59" font-weight="bold">CONTEXT</text><text x="206.5859375" y="296" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#64748B" font-style="italic">What the model knows about YOUR world</text><text x="114" y="322" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#475569">system prompt  ·  SKILL.md  ·  runbooks  ·  RAG  ·  evals</text><rect x="40" y="354" width="860" height="78" rx="10" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.8"/><rect x="40" y="354" width="58" height="78" rx="10" fill="#4338CA"/><rect x="80" y="354" width="18" height="78" rx="0" fill="#4338CA"/><text x="69" y="399.0" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">L2</text><text x="114" y="382" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#312E81" font-weight="bold">PROTOCOL</text><text x="219.58984375" y="382" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#64748B" font-style="italic">How it reaches tools and peers</text><text x="114" y="408" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#475569">MCP  (agent → tools)          A2A  (agent → agent)</text><rect x="40" y="440" width="860" height="78" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/><rect x="40" y="440" width="58" height="78" rx="10" fill="#7C3AED"/><rect x="80" y="440" width="18" height="78" rx="0" fill="#7C3AED"/><text x="69" y="485.0" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">L1</text><text x="114" y="468" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#5B21B6" font-weight="bold">CONTROL PLANE</text><text x="268.5859375" y="468" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#64748B" font-style="italic">Policy, identity, quotas, redaction</text><text x="114" y="494" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#475569">agentgateway  ·  Envoy AI Gateway  ·  LiteLLM  ·  ToolHive</text><rect x="40" y="526" width="860" height="78" rx="10" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.8"/><rect x="40" y="526" width="58" height="78" rx="10" fill="#E11D48"/><rect x="80" y="526" width="18" height="78" rx="0" fill="#E11D48"/><text x="69" y="571.0" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">L0</text><text x="114" y="554" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#9F1239" font-weight="bold">MODEL + COMPUTE</text><text x="293.28125" y="554" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#64748B" font-style="italic">The stateless function itself</text><text x="114" y="580" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#475569">API providers        |        self-hosted: vLLM · llm-d · GPUs</text><rect x="916" y="96" width="124" height="508" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 4"/><text x="978" y="130" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#475569" font-weight="bold" text-anchor="middle">CROSS-</text><text x="978" y="145" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#475569" font-weight="bold" text-anchor="middle">CUTTING</text><rect x="930" y="161" width="96" height="24" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2"/><text x="978" y="178" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#166534" font-weight="bold" text-anchor="middle">identity</text><rect x="930" y="195" width="96" height="24" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2"/><text x="978" y="212" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#166534" font-weight="bold" text-anchor="middle">RBAC</text><rect x="930" y="229" width="96" height="24" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2"/><text x="978" y="246" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#166534" font-weight="bold" text-anchor="middle">audit</text><rect x="930" y="263" width="96" height="24" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.2"/><text x="978" y="280" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#075985" font-weight="bold" text-anchor="middle">OTel</text><rect x="930" y="297" width="96" height="24" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.2"/><text x="978" y="314" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9A3412" font-weight="bold" text-anchor="middle">cost  $</text><rect x="40" y="626" width="1000" height="66" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="58" y="651" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#92400E" font-weight="bold">Category errors to avoid:</text><text x="58" y="671" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#475569">"MCP or RAG?"  →  MCP is L2, RAG is L3.        "kagent or an AI gateway?"  →  kagent is L4, the gateway is L1.</text></svg>