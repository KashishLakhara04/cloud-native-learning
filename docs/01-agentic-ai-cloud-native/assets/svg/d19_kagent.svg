<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460"><defs><marker id="ah16A34A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/></marker><marker id="ahD97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/></marker><marker id="ah7C3AED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/></marker><marker id="ah4338CA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4338CA"/></marker></defs><rect x="0" y="0" width="1080" height="460" fill="#FFFFFF"/><text x="40" y="40" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">kagent: "agents as CRDs" — why it is the right idea</text><text x="40" y="62" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">Take the thing operators hand-tend and reduce it to a reconciled object with a revision history. Kubernetes did this to servers; kagent does it to agents.</text><rect x="40" y="96" width="380" height="168" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.8"/><text x="62" y="124" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#115E59" font-weight="bold">Git repo — source of truth</text><rect x="62" y="142" width="336" height="34" rx="7" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.2"/><text x="76" y="156" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="10.5" fill="#1E293B">agents/istio-debugger.yaml</text><text x="76" y="169" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#115E59" font-weight="bold">kind: Agent</text><rect x="62" y="182" width="336" height="34" rx="7" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.2"/><text x="76" y="196" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="10.5" fill="#1E293B">models/opus.yaml</text><text x="76" y="209" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#115E59" font-weight="bold">kind: ModelConfig</text><rect x="62" y="222" width="336" height="34" rx="7" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.2"/><text x="76" y="236" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="10.5" fill="#1E293B">tools/prometheus.yaml</text><text x="76" y="249" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#115E59" font-weight="bold">kind: MCPServer</text><line x1="424" y1="180" x2="476" y2="180" stroke="#16A34A" stroke-width="2.2" marker-end="url(#ah16A34A)"/><text x="450" y="168" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#166534" font-weight="bold" text-anchor="middle">Flux CD /</text><text x="450" y="200" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#166534" font-weight="bold" text-anchor="middle">Argo CD</text><rect x="482" y="96" width="558" height="168" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/><text x="504" y="124" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#92400E" font-weight="bold">Cluster</text><rect x="504" y="136" width="190" height="44" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/><text x="599.0" y="161.565" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#92400E" font-weight="bold" text-anchor="middle">kagent controller</text><rect x="504" y="196" width="190" height="44" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/><text x="599.0" y="221.565" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#92400E" font-weight="bold" text-anchor="middle">Agent pods</text><line x1="599" y1="182" x2="599" y2="194" stroke="#D97706" stroke-width="1.6" marker-end="url(#ahD97706)"/><text x="614" y="192" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#64748B" font-style="italic">reconciles</text><rect x="730" y="136" width="130" height="44" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><text x="795.0" y="152.41500000000002" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#5B21B6" font-weight="bold" text-anchor="middle">A2A</text><text x="795.0" y="169.13500000000002" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569" text-anchor="middle">peer agents</text><rect x="730" y="196" width="130" height="44" rx="8" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.6"/><text x="795.0" y="212.41500000000002" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#312E81" font-weight="bold" text-anchor="middle">MCP</text><text x="795.0" y="229.13500000000002" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569" text-anchor="middle">via agentgateway</text><line x1="698" y1="158" x2="726" y2="158" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#ah7C3AED)"/><line x1="698" y1="218" x2="726" y2="218" stroke="#4338CA" stroke-width="1.6" marker-end="url(#ah4338CA)"/><rect x="880" y="166" width="140" height="74" rx="8" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.6"/><text x="950.0" y="197.26" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#312E81" font-weight="bold" text-anchor="middle">MCPServer pods</text><text x="950.0" y="213.34" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569" text-anchor="middle">deployed by kmcp</text><line x1="864" y1="218" x2="876" y2="218" stroke="#4338CA" stroke-width="1.6" marker-end="url(#ah4338CA)"/><rect x="40" y="286" width="1000" height="154" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="62" y="314" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#1E293B" font-weight="bold">WHAT THIS BUYS YOU — all of it from machinery you already run</text><text x="62" y="340" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#16A34A" font-weight="bold">✓</text><text x="80" y="340" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#1E293B" font-weight="bold">Your GitOps pipeline reviews agent changes</text><text x="378.33984375" y="340" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">— A PR widening an agent's tool surface gets the same review as one widening a NetworkPolicy</text><text x="62" y="364" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#16A34A" font-weight="bold">✓</text><text x="80" y="364" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#1E293B" font-weight="bold">Rollback is git revert</text><text x="227.5" y="364" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">— Agent behaviour is versioned like everything else</text><text x="62" y="388" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#16A34A" font-weight="bold">✓</text><text x="80" y="388" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#1E293B" font-weight="bold">RBAC already applies</text><text x="230.3828125" y="388" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">— Who may create an Agent object is a normal Kubernetes authorization question</text><text x="62" y="412" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#16A34A" font-weight="bold">✓</text><text x="80" y="412" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#1E293B" font-weight="bold">Track the satellites separately</text><text x="288.6484375" y="412" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">— kmcp, agentgateway and agentregistry move on their own cadence — normal for a Sandbox ecosystem</text></svg>