<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450"><rect x="0" y="0" width="1080" height="450" fill="#FFFFFF"/><text x="40" y="40" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">The three-tier context architecture</text><text x="40" y="62" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">Keep runbooks in Git next to your manifests and serve them through a small MCP server. They then have a review process, a diff history and an owner.</text><rect x="40" y="96" width="1000" height="104" rx="11" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.8"/><rect x="40" y="96" width="104" height="104" rx="11" fill="#0284C7"/><rect x="126" y="96" width="18" height="104" rx="0" fill="#0284C7"/><text x="92" y="144" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">TIER 1</text><text x="92" y="164" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="10" fill="#FFFFFF" text-anchor="middle" opacity="0.85">~500 tok</text><text x="164" y="126" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#075985" font-weight="bold">ALWAYS LOADED</text><text x="309.6640625" y="126" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">system prompt / agent spec</text><text x="164" y="150" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#475569">"You are an SRE agent for Acme. Read-only.</text><text x="164" y="167" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#475569">Max 12 steps. Never propose kubectl delete.</text><text x="164" y="184" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#475569">Always fetch the runbook first."</text><rect x="40" y="210" width="1000" height="104" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.8"/><rect x="40" y="210" width="104" height="104" rx="11" fill="#0D9488"/><rect x="126" y="210" width="18" height="104" rx="0" fill="#0D9488"/><text x="92" y="258" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">TIER 2</text><text x="92" y="278" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="10" fill="#FFFFFF" text-anchor="middle" opacity="0.85">~1,500 tok</text><text x="164" y="240" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#115E59" font-weight="bold">SKILL</text><text x="221.984375" y="240" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">loaded when the task matches</text><text x="164" y="264" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#475569">The triage procedure. The namespace → tool</text><text x="164" y="281" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#475569">availability matrix. The escalation policy.</text><text x="164" y="298" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#475569">Global exclusion rules.</text><rect x="40" y="324" width="1000" height="104" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/><rect x="40" y="324" width="104" height="104" rx="11" fill="#D97706"/><rect x="126" y="324" width="18" height="104" rx="0" fill="#D97706"/><text x="92" y="372" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">TIER 3</text><text x="92" y="392" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="10" fill="#FFFFFF" text-anchor="middle" opacity="0.85">~800 tok</text><text x="164" y="354" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#92400E" font-weight="bold">RUNBOOK</text><text x="257.19140625" y="354" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">fetched per-alert via a tool</text><text x="164" y="378" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#475569">The specific symptom. Known causes ranked by</text><text x="164" y="395" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#475569">historical frequency. Verification steps.</text><text x="164" y="412" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#475569">And the "do NOT" list.</text></svg>