<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="548" viewBox="0 0 1080 548"><rect x="0" y="0" width="1080" height="548" fill="#FFFFFF"/><text x="40" y="40" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">Observability: an agent run is a tree, not a request</text><text x="40" y="62" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">And the failure you most need to catch is not an error — it is a confident, wrong, expensive answer nobody flags for a week. There is no 500 for that.</text><rect x="40" y="92" width="470" height="282" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="62" y="118" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#1E293B" font-weight="bold">One investigation, as spans</text><text x="62" y="156" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#92400E" font-weight="bold">agent.invoke</text><text x="136" y="156" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#475569">investigate-alert</text><rect x="252.0" y="145" width="214.4" height="15" rx="4" fill="#D97706"/><text x="74" y="183" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#9F1239">gen_ai.chat</text><text x="148" y="183" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#475569">opus</text><rect x="253.6" y="172" width="41.6" height="15" rx="4" fill="#E11D48"/><text x="74" y="210" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#115E59">tools/call</text><text x="148" y="210" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#475569">fetch_runbook</text><rect x="296.8" y="199" width="35.2" height="15" rx="4" fill="#0D9488"/><text x="74" y="237" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#9F1239">gen_ai.chat</text><text x="148" y="237" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#475569">opus</text><rect x="333.6" y="226" width="38.400000000000006" height="15" rx="4" fill="#E11D48"/><text x="74" y="264" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#312E81">tools/call</text><text x="148" y="264" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#475569">get_pods</text><rect x="373.6" y="253" width="32.0" height="15" rx="4" fill="#4338CA"/><text x="86" y="291" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#312E81">mcp</text><text x="160" y="291" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#475569">SERVER span</text><rect x="376.8" y="280" width="25.6" height="15" rx="4" fill="#4338CA"/><text x="74" y="318" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#312E81">tools/call</text><text x="148" y="318" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#475569">query_prometheus</text><rect x="408.8" y="307" width="44.800000000000004" height="15" rx="4" fill="#4338CA"/><line x1="252" y1="136" x2="252" y2="325" stroke="#CBD5E1" stroke-width="1.2"/><text x="62" y="340" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#64748B" font-style="italic">Span name format, both sides:   {mcp.method.name} {target}</text><text x="62" y="356" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#64748B" font-style="italic">So a tool call is  tools/call get_pods  — never  POST /mcp.</text><rect x="540" y="92" width="500" height="282" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/><text x="562" y="118" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#92400E" font-weight="bold">THE STANDARD — and its honest status</text><text x="562" y="142" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">OpenTelemetry GenAI semantic conventions. The GenAI SIG formed April 2024;</text><text x="562" y="157" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">scope now covers LLM calls, agent orchestration, MCP tool calling, content</text><text x="562" y="172" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">capture and evaluation.</text><rect x="562" y="204" width="456" height="62" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.3"/><text x="576" y="224" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#9F1239" font-weight="bold">As of September 2026</text><text x="576" y="240" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">Every gen_ai.* attribute is still badged Development — below Alpha. The</text><text x="576" y="252" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">conventions moved to their own repo in June 2026 with no tagged release.</text><rect x="562" y="276" width="456" height="60" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.3"/><text x="576" y="296" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#166534" font-weight="bold">Instrument to it anyway</text><text x="576" y="312" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">Two vendor acquisitions in one quarter (Langfuse, Galileo) make the argument:</text><text x="576" y="324" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">instrument to the spec, let the backend be a detail.</text><rect x="40" y="390" width="244" height="138" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/><text x="56" y="414" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#9A3412" font-weight="bold">COST &amp; EFFICIENCY</text><text x="56" y="436" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#EA580C" font-weight="bold">·</text><text x="66" y="436" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">tokens per investigation</text><text x="56" y="456" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#EA580C" font-weight="bold">·</text><text x="66" y="456" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">$ per investigation</text><text x="56" y="476" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#EA580C" font-weight="bold">·</text><text x="66" y="476" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">$ per team / agent / skill</text><text x="56" y="496" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#EA580C" font-weight="bold">·</text><text x="66" y="496" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">cache hit rate</text><rect x="300" y="390" width="244" height="138" rx="10" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.6"/><text x="316" y="414" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#075985" font-weight="bold">RELIABILITY</text><text x="316" y="436" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#0284C7" font-weight="bold">·</text><text x="326" y="436" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">tool error rate by tool</text><text x="316" y="456" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#0284C7" font-weight="bold">·</text><text x="326" y="456" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">loop length p50/p95/p99</text><text x="316" y="476" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#0284C7" font-weight="bold">·</text><text x="326" y="476" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">% runs hitting step budget</text><text x="316" y="496" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#0284C7" font-weight="bold">·</text><text x="326" y="496" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">% ending "need more info"</text><rect x="560" y="390" width="244" height="138" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/><text x="576" y="414" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#115E59" font-weight="bold">QUALITY</text><text x="576" y="436" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#0D9488" font-weight="bold">·</text><text x="586" y="436" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">accuracy vs golden set</text><text x="576" y="456" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#0D9488" font-weight="bold">·</text><text x="586" y="456" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">human override rate</text><text x="576" y="476" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#0D9488" font-weight="bold">·</text><text x="586" y="476" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">escalation rate</text><text x="576" y="496" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#0D9488" font-weight="bold">·</text><text x="586" y="496" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">wasted tool calls per run</text><rect x="820" y="390" width="244" height="138" rx="10" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.6"/><text x="836" y="414" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#9F1239" font-weight="bold">SECURITY</text><text x="836" y="436" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#E11D48" font-weight="bold">·</text><text x="846" y="436" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">tool calls by authenticated USER</text><text x="836" y="456" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#E11D48" font-weight="bold">·</text><text x="846" y="456" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">denied-by-policy count</text><text x="836" y="476" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#E11D48" font-weight="bold">·</text><text x="846" y="476" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">approval prompts &amp; outcomes</text><text x="836" y="496" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#E11D48" font-weight="bold">·</text><text x="846" y="496" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">off-gateway shadow MCP usage</text></svg>