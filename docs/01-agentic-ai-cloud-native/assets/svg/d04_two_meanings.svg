<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470"><defs><marker id="ah0D9488" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D9488"/></marker><marker id="ah7C3AED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/></marker></defs><rect x="0" y="0" width="1080" height="470" fill="#FFFFFF"/><text x="40" y="40" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">Two things people mean by "Kubernetes MCP"</text><text x="40" y="62" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">This phrase is overloaded and causes real confusion. Deploying and creating are different jobs with different payoffs.</text><rect x="40" y="88" width="500" height="340" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.8"/><rect x="60" y="104" width="94.67578125" height="22" rx="11.0" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.3"/><text x="107.337890625" y="118.96" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#115E59" font-weight="bold" text-anchor="middle">MEANING  A</text><text x="60" y="154" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#115E59" font-weight="bold">MCP server  FOR  Kubernetes</text><text x="60" y="176" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#64748B" font-style="italic">The cluster is the SUBJECT.</text><rect x="60" y="196" width="110" height="46" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="115.0" y="222.72" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#334155" font-weight="bold" text-anchor="middle">Cursor</text><rect x="206" y="196" width="168" height="46" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/><text x="290.0" y="222.565" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#115E59" font-weight="bold" text-anchor="middle">k8s-mcp-server</text><rect x="410" y="196" width="110" height="46" rx="8" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.6"/><text x="465.0" y="215.36999999999998" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#312E81" font-weight="bold" text-anchor="middle">kube-</text><text x="465.0" y="229.45" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#312E81" font-weight="bold" text-anchor="middle">apiserver</text><line x1="172" y1="219" x2="204" y2="219" stroke="#0D9488" stroke-width="1.8" marker-end="url(#ah0D9488)"/><text x="188" y="210" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#115E59" text-anchor="middle">MCP</text><line x1="376" y1="219" x2="408" y2="219" stroke="#0D9488" stroke-width="1.8" marker-end="url(#ah0D9488)"/><text x="392" y="210" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#115E59" text-anchor="middle">client-go</text><text x="60" y="274" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#475569" font-weight="bold">Tools it exposes:</text><rect x="60" y="288" width="76.8828125" height="24" rx="12.0" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.3"/><text x="98.44140625" y="303.78" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="10.5" fill="#115E59" font-weight="bold" text-anchor="middle">list_pods</text><rect x="212" y="288" width="70.5625" height="24" rx="12.0" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.3"/><text x="247.28125" y="303.78" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="10.5" fill="#115E59" font-weight="bold" text-anchor="middle">get_logs</text><rect x="364" y="288" width="102.1640625" height="24" rx="12.0" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.3"/><text x="415.08203125" y="303.78" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="10.5" fill="#115E59" font-weight="bold" text-anchor="middle">describe_node</text><rect x="60" y="320" width="83.203125" height="24" rx="12.0" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.3"/><text x="101.6015625" y="335.78" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="10.5" fill="#115E59" font-weight="bold" text-anchor="middle">get_events</text><rect x="212" y="320" width="108.484375" height="24" rx="12.0" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.3"/><text x="266.2421875" y="335.78" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="10.5" fill="#115E59" font-weight="bold" text-anchor="middle">apply_manifest</text><rect x="60" y="358" width="460" height="52" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.2"/><text x="74" y="380" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#1E293B" font-weight="bold">Gives the agent kubectl.</text><text x="74" y="398" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Useful, generic, available off the shelf.</text><rect x="560" y="88" width="480" height="340" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/><rect x="580" y="104" width="94.546875" height="22" rx="11.0" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.3"/><text x="627.2734375" y="118.96" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#5B21B6" font-weight="bold" text-anchor="middle">MEANING  B</text><text x="580" y="154" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#5B21B6" font-weight="bold">MCP servers  ON  Kubernetes</text><text x="580" y="176" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#64748B" font-style="italic">The cluster is the PLATFORM.</text><rect x="580" y="196" width="92" height="46" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="626.0" y="222.72" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#334155" font-weight="bold" text-anchor="middle">Agent</text><rect x="706" y="196" width="314" height="46" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><text x="863.0" y="222.41" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#5B21B6" font-weight="bold" text-anchor="middle">MCPServer CRD → Deployment → Pod</text><line x1="674" y1="219" x2="704" y2="219" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#ah7C3AED)"/><text x="689" y="210" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#5B21B6" text-anchor="middle">HTTP</text><text x="580" y="274" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#475569" font-weight="bold">Any MCP server becomes a normal workload:</text><rect x="580" y="288" width="90.5234375" height="24" rx="12.0" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.3"/><text x="625.26171875" y="303.78" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#5B21B6" font-weight="bold" text-anchor="middle">GitHub MCP</text><rect x="730" y="288" width="101.75390625" height="24" rx="12.0" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.3"/><text x="780.876953125" y="303.78" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#5B21B6" font-weight="bold" text-anchor="middle">Postgres MCP</text><rect x="880" y="288" width="74.76171875" height="24" rx="12.0" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.3"/><text x="917.380859375" y="303.78" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#5B21B6" font-weight="bold" text-anchor="middle">your own</text><text x="580" y="336" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Managed by kmcp or ToolHive — image, Service,</text><text x="580" y="350" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">ServiceAccount, RBAC, NetworkPolicy, ingress.</text><rect x="580" y="360" width="440" height="52" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/><text x="594" y="382" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#1E293B" font-weight="bold">Gives your cluster an agent-tool platform.</text><text x="594" y="400" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">This is the lifecycle problem kmcp exists to solve.</text></svg>