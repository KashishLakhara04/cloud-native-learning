<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="340" viewBox="0 0 1080 340"><defs><marker id="ahE11D48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E11D48"/></marker></defs><rect x="0" y="0" width="1080" height="340" fill="#FFFFFF"/><text x="40" y="40" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">Why the default Cursor + MCP setup is ungovernable</text><text x="40" y="62" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">This is what almost every team has right now, usually without the platform team knowing.</text><rect x="40" y="90" width="420" height="200" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.8"/><rect x="60" y="104" width="139.83203125" height="22" rx="11.0" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.3"/><text x="129.916015625" y="118.78" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#9F1239" font-weight="bold" text-anchor="middle">DO  NOT  SHIP  THIS</text><text x="60" y="156" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#1E293B" font-weight="bold">Dev laptop</text><rect x="60" y="170" width="150" height="42" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="135.0" y="194.72" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#334155" font-weight="bold" text-anchor="middle">Cursor</text><rect x="244" y="170" width="196" height="42" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.6"/><text x="342.0" y="194.41" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#9F1239" font-weight="bold" text-anchor="middle">k8s-mcp-server</text><line x1="212" y1="191" x2="242" y2="191" stroke="#E11D48" stroke-width="1.8" marker-end="url(#ahE11D48)"/><text x="227" y="182" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#9F1239" text-anchor="middle">stdio</text><line x1="342" y1="212" x2="342" y2="238" stroke="#E11D48" stroke-width="1.8" marker-end="url(#ahE11D48)"/><rect x="216" y="240" width="244" height="34" rx="7" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.4"/><text x="338" y="262" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#9F1239" font-weight="bold" text-anchor="middle">~/.kube/config</text><text x="338" y="286" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#64748B" font-style="italic" text-anchor="middle">the developer's own admin credentials</text><rect x="500" y="90" width="540" height="200" rx="12" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.6"/><text x="522" y="116" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#9F1239" font-weight="bold">WHAT YOU LOSE</text><text x="522" y="142" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#E11D48" font-weight="bold">✕</text><text x="540" y="142" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Audit says "the MCP server called delete", never WHO</text><text x="522" y="166" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#E11D48" font-weight="bold">✕</text><text x="540" y="166" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Credentials on a laptop — unrotatable, not individually revocable</text><text x="522" y="190" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#E11D48" font-weight="bold">✕</text><text x="540" y="190" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Offboarding one dev forces rotation for everyone</text><text x="522" y="214" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#E11D48" font-weight="bold">✕</text><text x="540" y="214" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">No rate limit, no cost cap, no policy</text><text x="522" y="238" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#E11D48" font-weight="bold">✕</text><text x="540" y="238" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Platform team has zero visibility — this is shadow AI</text><text x="522" y="262" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#E11D48" font-weight="bold">✕</text><text x="540" y="262" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">The server process has the machine's full network access</text></svg>