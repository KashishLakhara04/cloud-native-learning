<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="812" viewBox="0 0 1080 812"><defs><marker id="ah64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs><rect x="0" y="0" width="1080" height="812" fill="#FFFFFF"/><text x="40" y="40" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">Reference architecture: authenticating and metering MCP from Cursor</text><text x="40" y="62" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">One endpoint in mcp.json. Everything else is enforcement you already know how to run.</text><rect x="40" y="94" width="700" height="122" rx="11" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.8"/><rect x="56" y="108" width="26" height="26" rx="13" fill="#0284C7"/><text x="69" y="126" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text><text x="94" y="126" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13.5" fill="#075985" font-weight="bold">Dev laptop — Cursor / Claude Code / VS Code</text><text x="70" y="148" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#0284C7" font-weight="bold">›</text><text x="84" y="148" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#475569">mcp.json points at ONE endpoint:  https://mcp.corp.internal/mcp</text><text x="70" y="167" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#0284C7" font-weight="bold">›</text><text x="84" y="167" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#475569">Streamable HTTP + OAuth 2.1   ·   Authorization: Bearer &lt;token&gt;</text><text x="70" y="186" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#0284C7" font-weight="bold">›</text><text x="84" y="186" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#475569">Mcp-Method: tools/call      Mcp-Name: get_pods</text><text x="724" y="126" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#64748B" font-style="italic" text-anchor="end">no local credentials</text><line x1="390.0" y1="216" x2="390.0" y2="228" stroke="#64748B" stroke-width="2.0" marker-end="url(#ah64748B)"/><rect x="40" y="230" width="700" height="158" rx="11" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/><rect x="56" y="244" width="26" height="26" rx="13" fill="#16A34A"/><text x="69" y="262" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text><text x="94" y="262" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13.5" fill="#166534" font-weight="bold">Identity provider — Keycloak / Okta / Entra ID</text><text x="70" y="284" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#16A34A" font-weight="bold">›</text><text x="84" y="284" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Authorization Code + PKCE</text><text x="70" y="303" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#16A34A" font-weight="bold">›</text><text x="84" y="303" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">audience-bound token  (RFC 8707 resource indicator)</text><text x="70" y="322" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#16A34A" font-weight="bold">›</text><text x="84" y="322" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">iss validated by the client  (RFC 9207 — closes AS mix-up)</text><text x="70" y="341" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#16A34A" font-weight="bold">›</text><text x="84" y="341" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">CIMD instead of deprecated Dynamic Client Registration</text><text x="70" y="360" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#16A34A" font-weight="bold">›</text><text x="84" y="360" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">groups / roles claim  →  platform-eng, app-dev, sre</text><text x="724" y="262" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#64748B" font-style="italic" text-anchor="end">who the human is</text><line x1="390.0" y1="388" x2="390.0" y2="400" stroke="#64748B" stroke-width="2.0" marker-end="url(#ah64748B)"/><rect x="40" y="402" width="700" height="200" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/><rect x="56" y="416" width="26" height="26" rx="13" fill="#7C3AED"/><text x="69" y="434" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text><text x="94" y="434" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13.5" fill="#5B21B6" font-weight="bold">MCP / agent gateway — agentgateway · Envoy AI GW · ToolHive</text><text x="70" y="456" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#7C3AED" font-weight="bold">›</text><text x="84" y="456" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">validate token, check AUDIENCE = this server</text><text x="70" y="475" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#7C3AED" font-weight="bold">›</text><text x="84" y="475" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">authorize the tool call  (CEL / OpenFGA / Cedar)</text><text x="70" y="494" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#7C3AED" font-weight="bold">›</text><text x="84" y="494" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">★  OBO propagation: forward END-USER identity downstream</text><text x="70" y="513" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#7C3AED" font-weight="bold">›</text><text x="84" y="513" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">scope the tool surface by role — dev sees 6 tools, SRE sees 20</text><text x="70" y="532" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#7C3AED" font-weight="bold">›</text><text x="84" y="532" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">rate limit + token/cost quota per user  ·  redact PII in args</text><text x="70" y="551" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#7C3AED" font-weight="bold">›</text><text x="84" y="551" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">approval gate on destructive tools  (MRTR elicitation)</text><text x="70" y="570" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#7C3AED" font-weight="bold">›</text><text x="84" y="570" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">emit OTel span + structured audit event</text><text x="724" y="434" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#64748B" font-style="italic" text-anchor="end">the enforcement point</text><line x1="390.0" y1="602" x2="390.0" y2="614" stroke="#64748B" stroke-width="2.0" marker-end="url(#ah64748B)"/><rect x="40" y="616" width="700" height="80" rx="11" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.8"/><rect x="56" y="630" width="26" height="26" rx="13" fill="#4338CA"/><text x="69" y="648" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text><text x="94" y="648" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13.5" fill="#312E81" font-weight="bold">MCP server pod — read-only SA · NetworkPolicy · sandboxed</text><text x="70" y="670" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#4338CA" font-weight="bold">›</text><text x="84" y="670" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">impersonates the end user against the apiserver</text><rect x="40" y="710" width="700" height="76" rx="11" fill="#F8FAFC" stroke="#64748B" stroke-width="1.8"/><rect x="56" y="724" width="26" height="26" rx="13" fill="#64748B"/><text x="69" y="742" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">5</text><text x="94" y="742" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13.5" fill="#334155" font-weight="bold">kube-apiserver — your EXISTING RBAC and audit log apply</text><text x="70" y="764" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-weight="bold">›</text><text x="84" y="764" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">no new authorization system to maintain</text><rect x="768" y="94" width="272" height="320" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/><text x="788" y="122" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#92400E" font-weight="bold">THE ONE DECISION</text><text x="788" y="142" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#64748B" font-style="italic">that matters most</text><text x="788" y="172" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#92400E" font-weight="bold">On-Behalf-Of</text><text x="788" y="190" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#92400E" font-weight="bold">propagation</text><rect x="788" y="208" width="232" height="62" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.3"/><text x="800" y="228" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#9F1239" font-weight="bold">WITHOUT OBO</text><text x="800" y="244" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569" font-style="italic">"gateway service account called the</text><text x="800" y="256" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569" font-style="italic">database write tool"</text><rect x="788" y="280" width="232" height="62" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.3"/><text x="800" y="300" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#166534" font-weight="bold">WITH OBO</text><text x="800" y="316" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569" font-style="italic">"kashish@company.com called the</text><text x="800" y="328" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569" font-style="italic">database write tool at 14:32 UTC"</text><text x="788" y="366" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#92400E" font-weight="bold">That is the difference between an audit</text><text x="788" y="381" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#92400E" font-weight="bold">log and an audit trail.</text><rect x="768" y="428" width="272" height="152" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="788" y="454" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#1E293B" font-weight="bold">IN KUBERNETES TERMS</text><text x="788" y="474" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">The cleanest implementation is user</text><text x="788" y="488" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">impersonation: the server's SA holds</text><text x="788" y="502" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">impersonate rights and sets</text><text x="788" y="516" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">Impersonate-User from the validated token</text><text x="788" y="530" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">claims.</text><text x="788" y="566" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#166534" font-weight="bold">Existing audit tooling keeps working.</text><rect x="768" y="594" width="272" height="112" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/><text x="788" y="618" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#115E59" font-weight="bold">ROLLOUT ORDER</text><text x="788" y="638" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#475569">1.  Audit the perimeter (laptops too)</text><text x="788" y="651" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#475569">2.  Gateway + internal registry</text><text x="788" y="664" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#475569">3.  Migrate one read-only server</text><text x="788" y="677" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#475569">4.  Scope tool surfaces by role</text><text x="788" y="690" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#475569">5.  Add write tools behind approval</text><text x="788" y="703" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#475569">6.  Close the shadow path via EDR/MDM</text></svg>