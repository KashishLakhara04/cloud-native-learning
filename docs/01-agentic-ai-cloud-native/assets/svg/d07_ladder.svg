<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430"><rect x="0" y="0" width="1080" height="430" fill="#FFFFFF"/><text x="40" y="40" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">The autonomy ladder — do not skip rungs</text><text x="40" y="62" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">Most teams should live happily on rungs 2–3 for a long time. That is where the value/risk ratio peaks.</text><rect x="40" y="96" width="1000" height="58" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/><rect x="40" y="96" width="84" height="58" rx="9" fill="#16A34A"/><rect x="106" y="96" width="18" height="58" rx="0" fill="#16A34A"/><text x="82" y="130" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle">RUNG 1</text><text x="140" y="121" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#166534" font-weight="bold">READ-ONLY EXPLAIN</text><text x="140" y="140" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Agent summarises. Human acts.</text><rect x="951.703125" y="114" width="74.296875" height="22" rx="11" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.3"/><text x="988.8515625" y="129" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#166534" font-weight="bold" text-anchor="middle">start here</text><rect x="54" y="162" width="986" height="58" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/><rect x="54" y="162" width="84" height="58" rx="9" fill="#16A34A"/><rect x="120" y="162" width="18" height="58" rx="0" fill="#16A34A"/><text x="96" y="196" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle">RUNG 2</text><text x="154" y="187" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#166534" font-weight="bold">INVESTIGATE</text><text x="154" y="206" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Agent chains read tools, posts an RCA into the alert thread.</text><rect x="901.26171875" y="180" width="124.73828125" height="22" rx="11" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.3"/><text x="963.630859375" y="195" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#166534" font-weight="bold" text-anchor="middle">~40% auto-resolve</text><rect x="68" y="228" width="972" height="58" rx="9" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.7"/><rect x="68" y="228" width="84" height="58" rx="9" fill="#0D9488"/><rect x="134" y="228" width="18" height="58" rx="0" fill="#0D9488"/><text x="110" y="262" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle">RUNG 3</text><text x="168" y="253" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#115E59" font-weight="bold">PROPOSE</text><text x="168" y="272" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Agent opens a PR or drafts the command. Human merges.</text><rect x="946.21875" y="246" width="79.78125" height="22" rx="11" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.3"/><text x="986.109375" y="261" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#115E59" font-weight="bold" text-anchor="middle">sweet spot</text><rect x="82" y="294" width="958" height="58" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.7"/><rect x="82" y="294" width="84" height="58" rx="9" fill="#D97706"/><rect x="148" y="294" width="18" height="58" rx="0" fill="#D97706"/><text x="124" y="328" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle">RUNG 4</text><text x="182" y="319" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#92400E" font-weight="bold">ACT WITH APPROVAL</text><text x="182" y="338" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Agent executes after human confirms in-flow (MRTR elicitation).</text><rect x="96" y="360" width="944" height="58" rx="9" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.7"/><rect x="96" y="360" width="84" height="58" rx="9" fill="#E11D48"/><rect x="162" y="360" width="18" height="58" rx="0" fill="#E11D48"/><text x="138" y="394" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle">RUNG 5</text><text x="196" y="385" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#9F1239" font-weight="bold">AUTONOMOUS, BOUNDED</text><text x="196" y="404" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Acts within a defined blast radius — one namespace, reversible ops, rate-limited.</text><rect x="937.79296875" y="378" width="88.20703125" height="22" rx="11" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.3"/><text x="981.896484375" y="393" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#9F1239" font-weight="bold" text-anchor="middle">rare, earned</text></svg>