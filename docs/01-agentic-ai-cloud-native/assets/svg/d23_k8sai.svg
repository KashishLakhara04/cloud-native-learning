<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470"><rect x="0" y="0" width="1080" height="470" fill="#FFFFFF"/><text x="40" y="40" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">The other half: Kubernetes as the AI platform</text><text x="40" y="62" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">Everything else here is AI for ops. This is ops for AI — where most of the CNCF engineering effort actually went. Kubernetes absorbed the AI wave rather than ceding it.</text><rect x="40" y="92" width="1000" height="88" rx="11" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.7"/><rect x="40" y="92" width="132" height="88" rx="11" fill="#0284C7"/><rect x="154" y="92" width="18" height="88" rx="0" fill="#0284C7"/><text x="106" y="142" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle">TRAFFIC</text><text x="190" y="122" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#075985" font-weight="bold">Gateway API Inference Extension</text><text x="190" y="140" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">GA. Routes on model name, LoRA adapter, endpoint health via an Endpoint</text><text x="190" y="153" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">Picker.</text><text x="620" y="122" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#075985" font-weight="bold">llm-d</text><text x="620" y="140" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">CNCF Sandbox, 24 Mar 2026. Prefill/decode disaggregation, KV-cache-aware</text><text x="620" y="153" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">routing.</text><rect x="40" y="186" width="1000" height="88" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.7"/><rect x="40" y="186" width="132" height="88" rx="11" fill="#0D9488"/><rect x="154" y="186" width="18" height="88" rx="0" fill="#0D9488"/><text x="106" y="236" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle">SCHEDULING</text><text x="190" y="216" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#115E59" font-weight="bold">DRA — Dynamic Resource Allocation</text><text x="190" y="234" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">Flexible accelerator allocation. GPUs are not fungible integers.</text><text x="620" y="216" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#115E59" font-weight="bold">Kueue</text><text x="620" y="234" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">Job queueing, quotas, fair sharing. Benchmarks show ~15% makespan</text><text x="620" y="247" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">reduction.</text><rect x="40" y="280" width="1000" height="88" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.7"/><rect x="40" y="280" width="132" height="88" rx="11" fill="#7C3AED"/><rect x="154" y="280" width="18" height="88" rx="0" fill="#7C3AED"/><text x="106" y="330" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle">SERVING</text><text x="190" y="310" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#5B21B6" font-weight="bold">vLLM</text><text x="190" y="328" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">The de-facto engine. PagedAttention / efficient KV cache.</text><text x="620" y="310" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#5B21B6" font-weight="bold">KServe  ·  LWS</text><text x="620" y="328" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">The "Deployment" of models; multi-pod multi-host serving.</text><rect x="40" y="374" width="1000" height="88" rx="11" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/><rect x="40" y="374" width="132" height="88" rx="11" fill="#16A34A"/><rect x="154" y="374" width="18" height="88" rx="0" fill="#16A34A"/><text x="106" y="424" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle">PORTABILITY</text><text x="190" y="404" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#166534" font-weight="bold">Certified Kubernetes AI Conformance</text><text x="190" y="422" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">Launched Nov 2025 with 18 platforms; 31 by KubeCon EU Mar 2026.</text><text x="620" y="404" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#166534" font-weight="bold">Kubernetes AI Requirements (KARs)</text><text x="620" y="422" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">Defines what a platform must support. Same play as Certified Kubernetes.</text><text x="40" y="490" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">Context: CNCF's 2025 survey found 82% of container users run Kubernetes in production, and 66% of organisations hosting generative AI already use it for inference.</text></svg>