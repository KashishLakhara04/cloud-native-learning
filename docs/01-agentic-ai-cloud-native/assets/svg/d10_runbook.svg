<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="482" viewBox="0 0 1080 482"><rect x="0" y="0" width="1080" height="482" fill="#FFFFFF"/><text x="40" y="40" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">Runbooks beat models — the measured result</text><text x="40" y="62" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">STCLab's two-person SRE team, reported via the CNCF blog, April 2026. Same alert, same model, with and without runbooks.</text><rect x="60" y="110" width="440" height="250" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="80" y="138" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#1E293B" font-weight="bold">Wasted tool calls per investigation</text><rect x="128" y="182.0" width="104" height="132.0" rx="6" fill="#E11D48"/><text x="180" y="214.0" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#FFFFFF" font-weight="bold" text-anchor="middle">16</text><text x="180" y="336" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569" text-anchor="middle">without runbooks</text><rect x="308" y="294" width="104" height="20" rx="6" fill="#16A34A"/><text x="360" y="284" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#166534" font-weight="bold" text-anchor="middle">2</text><text x="360" y="336" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569" text-anchor="middle">with runbooks</text><line x1="80" y1="316" x2="480" y2="316" stroke="#CBD5E1" stroke-width="1.5"/><rect x="366" y="162" width="112" height="50" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/><text x="422" y="186" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#166534" font-weight="bold" text-anchor="middle">8×</text><text x="422" y="203" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#166534" font-weight="bold" text-anchor="middle">fewer</text><rect x="540" y="110" width="500" height="250" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/><text x="560" y="138" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#166534" font-weight="bold">The rest of the numbers</text><text x="560" y="168" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#64748B" font-weight="bold">METRIC</text><text x="758" y="168" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#9F1239" font-weight="bold">WITHOUT</text><text x="900" y="168" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#166534" font-weight="bold">WITH</text><line x1="560" y1="176" x2="1020" y2="176" stroke="#16A34A" stroke-width="1.0" stroke-dasharray="3 3"/><text x="560" y="200" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#1E293B" font-weight="bold">Steps to conclusion</text><text x="758" y="200" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">20+, chasing 3 wrong</text><text x="758" y="213" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">hypotheses</text><text x="900" y="200" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#166534" font-weight="bold">3–4, rest spent</text><text x="900" y="213" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#166534" font-weight="bold">verifying</text><text x="560" y="244" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#1E293B" font-weight="bold">Quality score (same model)</text><text x="758" y="244" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">3.6 / 5</text><text x="900" y="244" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#166534" font-weight="bold">4.6 / 5</text><text x="560" y="288" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#1E293B" font-weight="bold">Cost per investigation</text><text x="758" y="288" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">—</text><text x="900" y="288" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#166534" font-weight="bold">~$0.04 (~$12/month)</text><text x="560" y="332" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#1E293B" font-weight="bold">Daily alerts → investigations</text><text x="758" y="332" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">40 raw</text><text x="900" y="332" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#166534" font-weight="bold">~12 after workload</text><text x="900" y="345" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#166534" font-weight="bold">dedup</text><rect x="40" y="378" width="1000" height="78" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.7"/><text x="60" y="404" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#92400E" font-weight="bold">The counterintuitive part:  exclusion beats inclusion.</text><text x="60" y="426" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#475569">What fixed quality was not telling the model what to do — it was telling it what NOT to do. The runbook does not hand it the answer; it narrows the search space</text><text x="60" y="442" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#475569">enough that a 12-step budget is plenty.</text></svg>