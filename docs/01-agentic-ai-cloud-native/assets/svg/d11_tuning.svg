<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490"><defs><marker id="ah64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker><marker id="ah16A34A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/></marker></defs><rect x="0" y="0" width="1080" height="490" fill="#FFFFFF"/><text x="40" y="40" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">"Training" a skill is a feedback loop, not fine-tuning</text><text x="40" y="62" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">Treat it exactly like tuning alert rules. The golden set is your test suite for a non-deterministic system.</text><rect x="48" y="100" width="190" height="96" rx="10" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.7"/><rect x="60" y="112" width="26" height="26" rx="13" fill="#0284C7"/><text x="73" y="130" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text><text x="94" y="130" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#075985" font-weight="bold">GOLDEN SET</text><text x="61" y="158" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">20–50 real past incidents with</text><text x="61" y="171" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">known root causes, stored as</text><text x="61" y="184" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">fixtures</text><line x1="239" y1="148" x2="249" y2="148" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah64748B)"/><rect x="252" y="100" width="190" height="96" rx="10" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.7"/><rect x="264" y="112" width="26" height="26" rx="13" fill="#0284C7"/><text x="277" y="130" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text><text x="298" y="130" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#075985" font-weight="bold">RUN</text><text x="265" y="158" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">Against them nightly, in CI</text><line x1="443" y1="148" x2="453" y2="148" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah64748B)"/><rect x="456" y="100" width="190" height="96" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.7"/><rect x="468" y="112" width="26" height="26" rx="13" fill="#0D9488"/><text x="481" y="130" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text><text x="502" y="130" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#115E59" font-weight="bold">SCORE</text><text x="469" y="158" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">Accuracy · tool calls · WASTED</text><text x="469" y="171" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">calls · $ · safety</text><line x1="647" y1="148" x2="657" y2="148" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah64748B)"/><rect x="660" y="100" width="190" height="96" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.7"/><rect x="672" y="112" width="26" height="26" rx="13" fill="#D97706"/><text x="685" y="130" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text><text x="706" y="130" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#92400E" font-weight="bold">DIAGNOSE</text><text x="673" y="158" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">Classify the failure — see the</text><text x="673" y="171" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">table below</text><line x1="851" y1="148" x2="861" y2="148" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah64748B)"/><rect x="864" y="100" width="190" height="96" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/><rect x="876" y="112" width="26" height="26" rx="13" fill="#16A34A"/><text x="889" y="130" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">5</text><text x="910" y="130" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#166534" font-weight="bold">COMMIT</text><text x="877" y="158" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">Fix, re-run, check for</text><text x="877" y="171" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">regression</text><path d="M 986 196 L 986 216 L 48 216 L 48 200" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah16A34A)"/><rect x="40" y="240" width="1000" height="226" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.7"/><text x="60" y="268" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#92400E" font-weight="bold">STEP 4 — the failure classes, and what each one actually means</text><text x="60" y="292" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#64748B" font-weight="bold">SYMPTOM</text><text x="440" y="292" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#64748B" font-weight="bold">THE REAL FIX</text><line x1="60" y1="300" x2="1020" y2="300" stroke="#CBD5E1" stroke-width="1.2"/><rect x="60" y="309" width="360" height="26" rx="6" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.2"/><text x="72" y="327" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#9F1239" font-weight="bold">Wrong tool chosen</text><text x="432" y="327" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#64748B" font-weight="bold">→</text><text x="456" y="327" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Fix the tool DESCRIPTION — the model picks from prose</text><rect x="60" y="343" width="360" height="26" rx="6" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.2"/><text x="72" y="361" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#9F1239" font-weight="bold">Right tool, wrong namespace</text><text x="432" y="361" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#64748B" font-weight="bold">→</text><text x="456" y="361" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Add an EXCLUSION rule to the runbook</text><rect x="60" y="377" width="360" height="26" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/><text x="72" y="395" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#92400E" font-weight="bold">Ran out of steps</text><text x="432" y="395" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#64748B" font-weight="bold">→</text><text x="456" y="395" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Narrow the search space — do not just raise the budget</text><rect x="60" y="411" width="360" height="26" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/><text x="72" y="429" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#92400E" font-weight="bold">Hallucinated a fact</text><text x="432" y="429" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#64748B" font-weight="bold">→</text><text x="456" y="429" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">The tool returned too much. Filter server-side.</text><rect x="60" y="445" width="360" height="26" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2"/><text x="72" y="463" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#166534" font-weight="bold">Correct but unsafe</text><text x="432" y="463" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#64748B" font-weight="bold">→</text><text x="456" y="463" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Move that tool behind an approval gate</text></svg>