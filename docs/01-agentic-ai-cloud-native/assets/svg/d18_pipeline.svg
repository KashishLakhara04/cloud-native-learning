DejaVu Sans, sans-serif" font-size="12" fill="#334155" font-weight="bold" text-anchor="middle">Alertmanager</text><line x1="352" y1="123" x2="374" y2="123" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah64748B)"/><text x="363" y="115" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="8.5" fill="#64748B" text-anchor="middle">webhook</text><rect x="376" y="100" width="176" height="46" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.6"/><text x="464.0" y="126.72" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#075985" font-weight="bold" text-anchor="middle">Robusta playbook</text><line x1="554" y1="123" x2="580" y2="123" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah64748B)"/><rect x="584" y="100" width="230" height="46" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.6"/><text x="699.0" y="126.255" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#075985" font-weight="bold" text-anchor="middle">enrich: logs, Grafana link, owner</text><line x1="540" y1="148" x2="540" y2="172" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah64748B)"/><rect x="300" y="174" width="480" height="62" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/><text x="540" y="198" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#92400E" font-weight="bold" text-anchor="middle">DEDUPE AT WORKLOAD LEVEL — not per-pod</text><text x="540" y="218" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">suppress repeats 30 min   ·   40 raw daily alerts → ~12 unique investigations</text><line x1="540" y1="238" x2="540" y2="262" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah64748B)"/><rect x="400" y="264" width="280" height="48" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/><text x="540.0" y="292.185" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-