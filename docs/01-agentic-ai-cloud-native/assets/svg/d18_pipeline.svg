540" y="420" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#475569" font-weight="bold" text-anchor="middle">ReAct loop, ≤ 12 steps</text><line x1="540" y1="430" x2="540" y2="450" stroke="#16A34A" stroke-width="1.8" marker-end="url(#ah16A34A)"/><rect x="330" y="452" width="420" height="46" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/><text x="540" y="474" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#166534" font-weight="bold" text-anchor="middle">Slack THREAD REPLY on the original alert message</text><text x="540" y="490" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#64748B" font-style="italic" text-anchor="middle">read in under 2 min instead of 15–20 min of manual triage</text><rect x="806" y="264" width="234" height="78" rx="10" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="824" y="288" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#9F1239" font-weight="bold">THE GLUE IS REAL WORK</text><text x="824" y="306" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">~200 lines of Python for timing, dedup,</text><text x="824" y="319" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">routing and thread matching. Budget</text><text x="824" y="332" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">for it.</text></svg>