<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420"><defs><marker id="ah64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs><rect x="0" y="0" width="1080" height="420" fill="#FFFFFF"/><text x="40" y="40" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">Why skills scale: progressive disclosure</text><text x="40" y="62" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">You can have 200 skills installed and pay for almost none of them. This is why a skill scales where a fat system prompt does not.</text><rect x="60" y="100" width="160" height="68" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/><text x="78" y="127" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#166534" font-weight="bold">ALWAYS IN CONTEXT</text><text x="78" y="148" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#475569">name + description only</text><rect x="236" y="122" width="143.6171875" height="24" rx="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.3"/><text x="307.80859375" y="138" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#166534" font-weight="bold" text-anchor="middle">~30 tokens per skill</text><line x1="100" y1="168" x2="100" y2="188" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah64748B)"/><text x="116" y="184" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#64748B" font-style="italic">↓  model decides this skill is relevant</text><rect x="60" y="196" width="420" height="68" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/><text x="78" y="223" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#92400E" font-weight="bold">LOADED ON DEMAND</text><text x="78" y="244" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#475569">the full SKILL.md body</text><rect x="496" y="218" width="137.96875" height="24" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/><text x="564.984375" y="234" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#92400E" font-weight="bold" text-anchor="middle">~500–2,000 tokens</text><line x1="100" y1="264" x2="100" y2="284" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah64748B)"/><text x="116" y="280" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#64748B" font-style="italic">↓  instructions point to a specific file</text><rect x="60" y="292" width="700" height="68" rx="10" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.8"/><text x="78" y="319" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#9F1239" font-weight="bold">LOADED IF REFERENCED</text><text x="78" y="340" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#475569">reference/*.md  ·  scripts/</text><rect x="776" y="314" width="103.203125" height="24" rx="12" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.3"/><text x="827.6015625" y="330" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#9F1239" font-weight="bold" text-anchor="middle">arbitrary size</text><rect x="60" y="392" width="960" height="44" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.4"/><text x="540" y="419" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#475569" text-anchor="middle">A SKILL.md is a folder of instructions. It is portable — the format is an open standard adopted by ~32 tools across vendors.</text></svg>