<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470"><defs><marker id="ah64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker><marker id="ah16A34A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/></marker></defs><rect x="0" y="0" width="1080" height="470" fill="#FFFFFF"/><text x="40" y="40" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">What an agent actually is: a loop with a budget</text><text x="40" y="62" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">Strip the marketing and an agent is: while not done: action = model(context); result = execute(action); context += result</text><rect x="60" y="116" width="168" height="74" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="144.0" y="156.875" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#334155" font-weight="bold" text-anchor="middle">GOAL + CONTEXT</text><rect x="268" y="116" width="168" height="74" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/><text x="352.0" y="147.88" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#92400E" font-weight="bold" text-anchor="middle">MODEL</text><text x="352.0" y="166.51999999999998" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569" text-anchor="middle">reads the state</text><rect x="476" y="116" width="168" height="74" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/><text x="560.0" y="147.88" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#92400E" font-weight="bold" text-anchor="middle">DECIDE</text><text x="560.0" y="166.51999999999998" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569" text-anchor="middle">which tool</text><rect x="684" y="116" width="168" height="74" rx="8" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.6"/><text x="768.0" y="147.88" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#312E81" font-weight="bold" text-anchor="middle">EXECUTE</text><text x="768.0" y="166.51999999999998" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569" text-anchor="middle">the tool call (MCP)</text><line x1="228" y1="153.0" x2="264" y2="153.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah64748B)"/><line x1="436" y1="153.0" x2="472" y2="153.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah64748B)"/><line x1="644" y1="153.0" x2="680" y2="153.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah64748B)"/><path d="M 768.0 190 L 768.0 230 L 352.0 230 L 352.0 194" fill="none" stroke="#16A34A" stroke-width="2.0" marker-end="url(#ah16A34A)"/><text x="560.0" y="246" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#166534" font-weight="bold" text-anchor="middle">observation appended to context</text><rect x="884" y="116" width="150" height="74" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/><text x="959.0" y="157.185" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13.5" fill="#166534" font-weight="bold" text-anchor="middle">ANSWER</text><line x1="852" y1="153.0" x2="880" y2="153.0" stroke="#16A34A" stroke-width="1.8" marker-end="url(#ah16A34A)"/><text x="878" y="140" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#64748B" text-anchor="end">done, or</text><text x="878" y="152" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#64748B" text-anchor="end">out of budget</text><rect x="40" y="262" width="600" height="176" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.6"/><text x="60" y="290" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#9F1239" font-weight="bold">BUDGETS — the thing you actually operate</text><text x="62" y="316" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#E11D48">●</text><text x="78" y="316" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#1E293B" font-weight="bold">max steps</text><text x="218" y="316" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#64748B">e.g. 12</text><text x="320" y="316" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">→  stops runaway loops</text><text x="62" y="344" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#E11D48">●</text><text x="78" y="344" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#1E293B" font-weight="bold">max tokens</text><text x="218" y="344" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#64748B">e.g. 100k</text><text x="320" y="344" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">→  caps cost</text><text x="62" y="372" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#E11D48">●</text><text x="78" y="372" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#1E293B" font-weight="bold">max wall-clock</text><text x="218" y="372" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#64748B">e.g. 5 min</text><text x="320" y="372" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">→  caps incident latency</text><text x="62" y="400" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#E11D48">●</text><text x="78" y="400" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#1E293B" font-weight="bold">allowed tools</text><text x="218" y="400" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#64748B">allowlist</text><text x="320" y="400" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">→  caps blast radius</text><rect x="660" y="262" width="380" height="176" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="680" y="290" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#1E293B" font-weight="bold">AGENT  vs  WORKFLOW</text><rect x="680" y="304" width="340" height="54" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.4"/><text x="694" y="325" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#075985" font-weight="bold">WORKFLOW</text><text x="694" y="342" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">You control the path. High determinism.</text><rect x="680" y="364" width="340" height="54" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/><text x="694" y="385" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#92400E" font-weight="bold">AGENT</text><text x="694" y="402" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">The model controls the path. Low determinism.</text></svg>