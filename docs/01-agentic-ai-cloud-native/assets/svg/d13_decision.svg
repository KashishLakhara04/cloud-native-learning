<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380"><rect x="0" y="0" width="1080" height="380" fill="#FFFFFF"/><text x="40" y="40" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">Skill, MCP, RAG or fine-tuning? The decision that matters</text><text x="40" y="62" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">These are not competitors. They supply different things, and mixing them up is the most common architectural error.</text><rect x="40" y="92" width="244" height="254" rx="12" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.8"/><rect x="40" y="92" width="244" height="46" rx="12" fill="#4338CA"/><rect x="40" y="122" width="244" height="16" rx="0" fill="#4338CA"/><text x="162.0" y="122" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">MCP</text><text x="162.0" y="164" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#312E81" font-weight="bold" text-anchor="middle">CAPABILITY</text><text x="162.0" y="182" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#64748B" font-style="italic" text-anchor="middle">the ability to DO or FETCH</text><line x1="58" y1="206" x2="266" y2="206" stroke="#4338CA" stroke-width="1.0" stroke-dasharray="3 3"/><text x="56" y="228" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="8.5" fill="#64748B" font-weight="bold">COST TO CHANGE</text><text x="56" y="244" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#312E81" font-weight="bold">Deploy a server</text><text x="56" y="272" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="8.5" fill="#64748B" font-weight="bold">EXAMPLES</text><text x="56" y="288" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">"Read the cluster state"</text><text x="56" y="304" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">"Open a PR"</text><text x="56" y="320" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">"Query Prometheus"</text><rect x="300" y="92" width="244" height="254" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.8"/><rect x="300" y="92" width="244" height="46" rx="12" fill="#0D9488"/><rect x="300" y="122" width="244" height="16" rx="0" fill="#0D9488"/><text x="422.0" y="122" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">SKILL</text><text x="422.0" y="164" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#115E59" font-weight="bold" text-anchor="middle">PROCEDURE</text><text x="422.0" y="182" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#64748B" font-style="italic" text-anchor="middle">how WE do it here</text><line x1="318" y1="206" x2="526" y2="206" stroke="#0D9488" stroke-width="1.0" stroke-dasharray="3 3"/><text x="316" y="228" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="8.5" fill="#64748B" font-weight="bold">COST TO CHANGE</text><text x="316" y="244" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#115E59" font-weight="bold">A git commit</text><text x="316" y="272" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="8.5" fill="#64748B" font-weight="bold">EXAMPLES</text><text x="316" y="288" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">"Our triage order"</text><text x="316" y="304" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">"Never touch Loki in tenant-*"</text><text x="316" y="320" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">"Escalate after 2 hypotheses"</text><rect x="560" y="92" width="244" height="254" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/><rect x="560" y="92" width="244" height="46" rx="12" fill="#7C3AED"/><rect x="560" y="122" width="244" height="16" rx="0" fill="#7C3AED"/><text x="682.0" y="122" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">RAG</text><text x="682.0" y="164" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#5B21B6" font-weight="bold" text-anchor="middle">KNOWLEDGE</text><text x="682.0" y="182" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#64748B" font-style="italic" text-anchor="middle">facts from a large corpus</text><line x1="578" y1="206" x2="786" y2="206" stroke="#7C3AED" stroke-width="1.0" stroke-dasharray="3 3"/><text x="576" y="228" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="8.5" fill="#64748B" font-weight="bold">COST TO CHANGE</text><text x="576" y="244" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#5B21B6" font-weight="bold">A pipeline run</text><text x="576" y="272" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="8.5" fill="#64748B" font-weight="bold">EXAMPLES</text><text x="576" y="288" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">"Search 4 years of postmortems"</text><text x="576" y="304" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">"Find the vendor doc"</text><text x="576" y="320" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">(thousands of docs only)</text><rect x="820" y="92" width="244" height="254" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.8"/><rect x="820" y="92" width="244" height="46" rx="12" fill="#E11D48"/><rect x="820" y="122" width="244" height="16" rx="0" fill="#E11D48"/><text x="942.0" y="122" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">FINE-TUNE</text><text x="942.0" y="164" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9F1239" font-weight="bold" text-anchor="middle">BEHAVIOUR</text><text x="942.0" y="182" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#64748B" font-style="italic" text-anchor="middle">baked into the weights</text><line x1="838" y1="206" x2="1046" y2="206" stroke="#E11D48" stroke-width="1.0" stroke-dasharray="3 3"/><text x="836" y="228" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="8.5" fill="#64748B" font-weight="bold">COST TO CHANGE</text><text x="836" y="244" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#9F1239" font-weight="bold">Retrain — very high</text><text x="836" y="272" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="8.5" fill="#64748B" font-weight="bold">EXAMPLES</text><text x="836" y="288" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">Almost never for ops.</text><text x="836" y="304" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">If you are considering this,</text><text x="836" y="320" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#475569">you under-invested in the other three.</text></svg>