<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500"><defs><marker id="ah0D9488" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D9488"/></marker><marker id="ah7C3AED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/></marker></defs><rect x="0" y="0" width="1080" height="500" fill="#FFFFFF"/><text x="40" y="40" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">RAG from first principles</text><text x="40" y="62" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">A model has parametric memory — frozen in weights. RAG adds non-parametric memory you query at request time. It is not a technology; it is "look it up before you answer."</text><rect x="40" y="92" width="1000" height="116" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.7"/><rect x="60" y="106" width="148.421875" height="22" rx="11.0" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.3"/><text x="134.2109375" y="120.78" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#115E59" font-weight="bold" text-anchor="middle">INDEX  TIME  ·  offline</text><rect x="62" y="152" width="130" height="44" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="127.0" y="177.72" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#334155" font-weight="bold" text-anchor="middle">docs</text><text x="127.0" y="208" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">runbooks, postmortems</text><line x1="196" y1="174" x2="222" y2="174" stroke="#0D9488" stroke-width="1.8" marker-end="url(#ah0D9488)"/><rect x="226" y="152" width="170" height="44" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/><text x="311.0" y="177.72" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#115E59" font-weight="bold" text-anchor="middle">CHUNK</text><text x="311.0" y="208" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">on semantic boundaries,</text><text x="311.0" y="220" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">not character counts</text><line x1="400" y1="174" x2="426" y2="174" stroke="#0D9488" stroke-width="1.8" marker-end="url(#ah0D9488)"/><rect x="430" y="152" width="150" height="44" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/><text x="505.0" y="177.72" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#115E59" font-weight="bold" text-anchor="middle">EMBED</text><text x="505.0" y="208" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">text → vector</text><line x1="584" y1="174" x2="610" y2="174" stroke="#0D9488" stroke-width="1.8" marker-end="url(#ah0D9488)"/><rect x="614" y="152" width="200" height="44" rx="8" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.6"/><text x="714.0" y="177.72" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#312E81" font-weight="bold" text-anchor="middle">VECTOR STORE</text><text x="714.0" y="208" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">Qdrant · pgvector ·</text><text x="714.0" y="220" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">OpenSearch</text><rect x="812" y="144" width="212" height="60" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.3" stroke-dasharray="4 3"/><text x="918" y="166" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#115E59" font-weight="bold" text-anchor="middle">+ keyword (BM25) index</text><text x="918" y="184" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">always hybrid, never vectors alone</text><rect x="40" y="226" width="1000" height="116" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.7"/><rect x="60" y="240" width="150.83984375" height="22" rx="11.0" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.3"/><text x="135.419921875" y="254.78" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#5B21B6" font-weight="bold" text-anchor="middle">QUERY  TIME  ·  online</text><rect x="62" y="286" width="118" height="40" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="121.0" y="309.565" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#334155" font-weight="bold" text-anchor="middle">question</text><line x1="182" y1="306" x2="196" y2="306" stroke="#7C3AED" stroke-width="1.7" marker-end="url(#ah7C3AED)"/><rect x="198" y="286" width="104" height="40" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><text x="250.0" y="309.565" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#5B21B6" font-weight="bold" text-anchor="middle">EMBED</text><line x1="304" y1="306" x2="318" y2="306" stroke="#7C3AED" stroke-width="1.7" marker-end="url(#ah7C3AED)"/><rect x="320" y="286" width="108" height="40" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><text x="374.0" y="309.565" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#5B21B6" font-weight="bold" text-anchor="middle">SEARCH</text><line x1="430" y1="306" x2="444" y2="306" stroke="#7C3AED" stroke-width="1.7" marker-end="url(#ah7C3AED)"/><rect x="446" y="286" width="112" height="40" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><text x="502.0" y="309.565" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#5B21B6" font-weight="bold" text-anchor="middle">RERANK</text><line x1="560" y1="306" x2="574" y2="306" stroke="#7C3AED" stroke-width="1.7" marker-end="url(#ah7C3AED)"/><rect x="576" y="286" width="130" height="40" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><text x="641.0" y="309.565" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#5B21B6" font-weight="bold" text-anchor="middle">into context</text><line x1="708" y1="306" x2="722" y2="306" stroke="#7C3AED" stroke-width="1.7" marker-end="url(#ah7C3AED)"/><rect x="724" y="286" width="104" height="40" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.6"/><text x="776.0" y="309.565" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9F1239" font-weight="bold" text-anchor="middle">MODEL</text><line x1="830" y1="306" x2="844" y2="306" stroke="#7C3AED" stroke-width="1.7" marker-end="url(#ah7C3AED)"/><rect x="846" y="286" width="108" height="40" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="900.0" y="309.565" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#334155" font-weight="bold" text-anchor="middle">answer</text><rect x="40" y="360" width="640" height="126" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.6"/><text x="60" y="386" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9F1239" font-weight="bold">WHERE IT BREAKS — all six are your problem, not the model's</text><text x="62" y="412" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#E11D48" font-weight="bold">✕</text><text x="78" y="412" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">Chunking destroys meaning</text><text x="372" y="412" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#E11D48" font-weight="bold">✕</text><text x="388" y="412" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">Chunk lacks parent context</text><text x="62" y="436" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#E11D48" font-weight="bold">✕</text><text x="78" y="436" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">Vector search finds similar, not correct</text><text x="372" y="436" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#E11D48" font-weight="bold">✕</text><text x="388" y="436" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">More retrieval ≠ better answers</text><text x="62" y="460" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#E11D48" font-weight="bold">✕</text><text x="78" y="460" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">Stale index</text><text x="372" y="460" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#E11D48" font-weight="bold">✕</text><text x="388" y="460" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#475569">No access control ← kills most enterprise RAG</text><rect x="700" y="360" width="340" height="126" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/><text x="720" y="386" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#166534" font-weight="bold">FOR A DEVOPS ENGINEER</text><text x="720" y="410" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">If you have 50 runbooks, you do not need RAG. A skill</text><text x="720" y="425" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">with a file index and a fetch_runbook tool is simpler,</text><text x="720" y="440" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">faster, cheaper and version-controlled. Reach for a</text><text x="720" y="455" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">vector store at thousands of documents.</text></svg>