<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490"><rect x="0" y="0" width="1080" height="490" fill="#FFFFFF"/><text x="40" y="40" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">The gateway landscape: two lineages</text><text x="40" y="62" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748B" font-style="italic">Read vendor benchmarks skeptically — each was run by the project it favours, on the workload shape that flatters its architecture.</text><rect x="40" y="92" width="500" height="300" rx="12" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.8"/><text x="62" y="120" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#312E81" font-weight="bold">INFRA-FIRST</text><text x="62" y="140" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#64748B" font-style="italic">Started from "I run Envoy and the Gateway API"</text><rect x="62" y="158" width="456" height="52" rx="8" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.3"/><text x="76" y="177" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#312E81" font-weight="bold">agentgateway</text><text x="76" y="191" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.8" fill="#475569">Rust data plane for agent traffic. Native MCP + A2A, tool federation, CEL RBAC. LF</text><text x="76" y="203" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.8" fill="#475569">project, Aug 2025.</text><rect x="62" y="216" width="456" height="52" rx="8" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.3"/><text x="76" y="235" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#312E81" font-weight="bold">Envoy AI Gateway</text><text x="76" y="249" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.8" fill="#475569">v1.0 June 2026 — control-plane API stable. ~16 providers, full MCP gateway, OTel.</text><text x="76" y="261" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.8" fill="#475569">Apache-2.0.</text><rect x="62" y="274" width="456" height="52" rx="8" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.3"/><text x="76" y="293" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#312E81" font-weight="bold">kgateway</text><text x="76" y="307" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.8" fill="#475569">CNCF, Envoy-based. Adopting agentgateway as its AI data plane rather than</text><text x="76" y="319" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.8" fill="#475569">extending Envoy directly.</text><rect x="62" y="332" width="456" height="52" rx="8" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.3"/><text x="76" y="351" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#312E81" font-weight="bold">Kong AI Gateway</text><text x="76" y="365" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.8" fill="#475569">Fits if you already run Kong. Native A2A proxying.</text><rect x="560" y="92" width="480" height="300" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.8"/><text x="582" y="120" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#9A3412" font-weight="bold">REQUEST-FIRST</text><text x="582" y="140" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#64748B" font-style="italic">Started from "one API in front of 100+ providers"</text><rect x="582" y="158" width="436" height="52" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.3"/><text x="596" y="177" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#9A3412" font-weight="bold">LiteLLM</text><text x="596" y="191" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.8" fill="#475569">The pragmatic default. Huge provider coverage, easy to self-host, good virtual-key</text><text x="596" y="203" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.8" fill="#475569">and budget story.</text><rect x="582" y="216" width="436" height="52" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.3"/><text x="596" y="235" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#9A3412" font-weight="bold">Bifrost</text><text x="596" y="249" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.8" fill="#475569">Performance-focused: ~11µs overhead at 5,000 RPS, 25+ providers. Same keys</text><text x="596" y="261" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.8" fill="#475569">for LLM and MCP calls.</text><rect x="582" y="274" width="436" height="52" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.3"/><text x="596" y="293" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#9A3412" font-weight="bold">ToolHive</text><text x="596" y="307" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.8" fill="#475569">MCP-specific. Containerised runtime + k8s operator + curated registry. Per-request</text><text x="596" y="319" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.8" fill="#475569">identity and audit.</text><rect x="582" y="332" width="436" height="52" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.3"/><text x="596" y="351" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#9A3412" font-weight="bold">Portkey / TrueFoundry</text><text x="596" y="365" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="9.8" fill="#475569">Commercial. Portkey acquired by Palo Alto Networks, April 2026.</text><rect x="40" y="406" width="1000" height="68" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/><text x="62" y="432" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#166534" font-weight="bold">HOW TO CHOOSE</text><text x="62" y="456" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Already on Kubernetes with Envoy and the Gateway API?  →  Envoy AI Gateway or kgateway/agentgateway. Same CRDs, same operational model, same Envoy you already debug.</text><text x="62" y="470" xml:space="preserve" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">Want something running this afternoon for a handful of teams?  →  LiteLLM.</text></svg>